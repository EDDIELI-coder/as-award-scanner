name: 星宇每月現金價

on:
  schedule:
    # 每日台灣時間 03:33 檢查；8 日起每月成功更新一次。
    # 未完成最多三次，網站阻擋至少等 48 小時；已完成時不呼叫星宇。
    - cron: '33 19 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 僅核對大阪下個月去程頭等與來回參考價（最多三次請求）
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/cash.yml']

permissions:
  contents: read
  actions: write

concurrency:
  group: starlux-cash
  cancel-in-progress: false

env:
  PRIVATE_REPO: EDDIELI-coder/claude--
  TZ: Asia/Taipei

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: main
          token: ${{ secrets.DATA_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 部署只做離線測試，不查詢航空
        run: python -m unittest discover -s jx_fares -p test_monthly_cash.py
  cash:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: main
          token: ${{ secrets.DATA_TOKEN }}
          path: src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: data
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: award-data
          token: ${{ secrets.DATA_TOKEN }}
          path: data
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -q requests==2.32.5
      - name: 更新星宇現金價（獨立於 Alaska）
        id: cash
        working-directory: data
        env:
          SAMPLE: ${{ inputs.sample == true }}
        run: |
          args=()
          if [ "$SAMPLE" = "true" ]; then args+=(--sample); fi
          rc=0
          python ../src/jx_fares/monthly_cash.py "${args[@]}" > cash_log.txt 2>&1 || rc=$?
          grep '^\[現金價\]' cash_log.txt || true
          if [ "$rc" -eq 3 ] && [ "$SAMPLE" != "true" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path('jx_cash_state.json').read_text(encoding='utf-8'))
          pending = state['last_run']['pending']
          retry = state['retry_after']
          print(f'::notice title=星宇現金價可接續::本輪達執行上限，待查 {pending} 項；{retry} 後依原排程補查。')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(f'星宇現金價本輪達執行上限。待查 **{pending}** 項；**{retry}** 後依原排程補查。僅全部完成才結算本月。\n')
          PY
            exit 0
          fi
          exit "$rc"
      - name: 保存已完成部分與待查進度
        id: save
        if: ${{ always() && steps.data.outcome == 'success' && (steps.cash.outcome == 'success' || steps.cash.outcome == 'failure') }}
        working-directory: data
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          cat <<'EOF' > "$askpass"
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *) printf '%s\n' "$DATA_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git config user.name "award-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in jx_cash_fares.json jx_cash_fares.md jx_cash_state.json jx_cash_probe.json cash_log.txt; do
            [ ! -f "$f" ] || git add "$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "星宇現金價 $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            if git -c credential.helper= push -q origin HEAD:award-data; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 5))
            git -c credential.helper= pull -q --rebase origin award-data || exit 1
          done
          exit 1
      - name: 更新快查頁
        if: ${{ always() && steps.save.outcome == 'success' && steps.save.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: gh api -X POST "repos/$PRIVATE_REPO/dispatches" -f event_type=scan-done
      - name: 保持排程啟用
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cash.yml/enable"
