name: 掃描

# 只負責掃描：程式與資料都在私人 repo（EDDIELI-coder/claude--），這裡用 DATA_TOKEN 讀寫。
# 要跑哪些掃描由 jx_fares/run_scans.py 依 scan_state.json 決定（近期頭等每次都跑）。
# 掃完把資料寫回私人 repo 的 award-data 分支，再通知私人 repo 產生快查頁、比對新位子、傳 Telegram。
# 公開的執行紀錄只印成功／失敗的數字；完整紀錄存在私人 repo 的 scan_log.txt。

on:
  schedule:
    - cron: '17 */4 * * *'   # 每 4 小時（台灣時間 0、4、8、12、16、20 點 17 分）
  workflow_dispatch:
    inputs:
      mode:
        description: 留空＝照排程；或指定模式（逗號分隔）：near, daily, fsweep, firstfar, weekly, business, japan, census, smoke
        type: string
        default: ''

permissions:
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

env:
  PRIVATE_REPO: EDDIELI-coder/claude--

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
    steps:
      - name: 取得掃描程式（私人 repo main）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: src
          persist-credentials: false

      - name: 取得資料（私人 repo award-data）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          ref: award-data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: |
          pip install -q -r src/jx_fares/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: 掃描
        working-directory: data
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python ../src/jx_fares/run_scans.py ${MODE:+--force "$MODE"} > scan_log.txt 2>&1 || rc=$?
          # 公開紀錄只印排程與摘要
          grep -E '^(台灣時間|上次被擋|\[摘要\]|已跑超過)' scan_log.txt || true
          exit ${rc:-0}

      - name: 存回私人 repo
        if: ${{ !contains(inputs.mode, 'smoke') }}
        working-directory: data
        run: |
          git config user.name "award-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in as_awards.json scan_status.json scan_state.json scan_log.txt jx_cash_fares.json jx_cash_fares.md; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -q -m "掃描 $(date '+%Y-%m-%d %H:%M')" || { echo "沒有變動"; exit 0; }
          # 私人 repo 的通知流程也會寫 award-data（不同檔案），衝突時重抓再推
          for i in 1 2 3 4; do
            git push -q origin HEAD:award-data && exit 0
            sleep $((i * 5)); git pull -q --rebase origin award-data
          done
          exit 1

      - name: 通知私人 repo 處理（快查頁、新位子、Telegram）
        if: ${{ !contains(inputs.mode, 'smoke') }}
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          curl -sS --fail -X POST -H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO/dispatches" \
            -d '{"event_type":"scan-done"}' && echo "已通知"

      - name: 保持排程啟用
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan.yml/enable" && echo "排程保持啟用"

      - name: 失敗時通知私人 repo（傳 Telegram）
        if: failure()
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO/dispatches" \
            -d "{\"event_type\":\"scan-failed\",\"client_payload\":{\"url\":\"$RUN_URL\"}}" > /dev/null || true
